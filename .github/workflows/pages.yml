name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      # Only the static application files are published; server.mjs and tests stay out.
      - run: |
          mkdir -p site/docs
          cp index.html styles.css favicon.svg robots.txt sitemap.xml site/
          cp docs/screenshot.png site/docs/
          cp -R src site/src
      - uses: actions/configure-pages@v5
        with:
          # Enables Pages (source: GitHub Actions) on first run so no manual setup is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
